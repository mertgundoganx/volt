name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing here needs a debugger, and the artefacts are thrown away.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where it is developed; Ubuntu is where the path handling
        # and the loopback socket tests are most likely to disagree with it.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The `tauri` crate links against webkit2gtk, so even `cargo test` needs
      # these on Linux. No bundling happens here.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Network tests are `#[ignore]`d, so this needs no internet. The mock
      # server, WebSocket, SSE and gRPC tests bind real loopback sockets.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `app/types.ts` mirrors `src-tauri/src/model.rs` by hand, so a struct
      # changed without its interface shows up here as `undefined`.
      - name: Typecheck
        run: pnpm typecheck

      # The SPA Tauri ships has to actually build.
      - name: Build the SPA
        run: pnpm generate

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      # `rust-version` in Cargo.toml is a promise; this is what keeps it one.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: msrv

      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
