name: Create user
seq: 2
method: POST
url: '{{baseUrl}}/users'
headers:
  - name: Content-Type
    value: application/json
    enabled: true
body:
  type: json
  content: |-
    {
      "name": "Ada Lovelace",
      "email": "ada@example.com"
    }
auth:
  type: inherit
docs: |-
  `auth: inherit` falls back to whatever `collection.yaml` defines, so a
  collection-wide token does not have to be repeated in every request.
